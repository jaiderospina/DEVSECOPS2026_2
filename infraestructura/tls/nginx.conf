pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # Exclude bodies, headers, query strings and credential values from access logs.
    log_format safe '$request_method $uri $status upstream=$upstream_status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    ssl_certificate /run/tls/server.pem;
    ssl_certificate_key /run/tls/server.key;
    ssl_password_file /run/tls/server.pass;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_session_tickets off;
    map $host $valid_host { default 0; localhost 1; 127.0.0.1 1; }
    limit_req_zone $binary_remote_addr zone=auth_client:10m rate=10r/m;
    limit_req_zone $server_name zone=auth_total:1m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=auth_connections:10m;
    limit_conn_zone $server_name zone=auth_total_connections:1m;
    map $http_origin $cors_origin {
        default "";
        "https://localhost:8443" "https://localhost:8443";
        "https://localhost:8444" "https://localhost:8444";
    }
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level notice;
    limit_conn_log_level notice;

    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        location / { proxy_pass http://frontend:5173; proxy_set_header Host $host; }
    }
    server {
        listen 8444 ssl;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        location / { proxy_pass http://permissions-grid:5173; proxy_set_header Host $host; }
    }
    server {
        listen 8445 ssl;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 429 = @auth_throttled;
        location @auth_throttled {
            default_type application/json;
            add_header Retry-After "6" always;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 429 '{"detail":"Demasiadas solicitudes de autenticación. Intente nuevamente."}';
        }
        location /auth/ {
            limit_req zone=auth_client burst=5 nodelay;
            limit_req zone=auth_total burst=10 nodelay;
            limit_conn auth_connections 2;
            limit_conn auth_total_connections 2;
            proxy_pass http://identity:8003;
            proxy_set_header Host $host;
            # Overwrite forwarded metadata. App does not trust arbitrary XFF.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { proxy_pass http://identity:8003; proxy_set_header Host $host; }
    }
    server {
        listen 8446 ssl;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        location / { proxy_pass http://permissions:8005; proxy_set_header Host $host; }
    }
}
