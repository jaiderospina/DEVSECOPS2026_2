sonar.projectKey=yeisonfblopez_DevSecOps-proyecto-Final-ci
sonar.organization=yeisonfblopez
sonar.python.version=3.12,3.14
sonar.sources=.
sonar.tests=tests,dast
sonar.test.inclusions=tests/**,dast/test_*.py
# Generated scanner/evidence archives are excluded; all authored application and tooling code stays in scope.
sonar.exclusions=tests/**,dast/test_*.py,docs/evidencias/**/*.html,docs/evidencias/**/sonar-cobertura-ci/**,docs/evidencias/**/stride-hardening-lab/**,reports/**,coverage-input/**

# Generated by measured tests of this same CI revision, before SonarScanner.
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=reports/frontend-coverage.lcov
